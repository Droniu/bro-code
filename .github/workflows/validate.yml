name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace and plugin manifests
        run: |
          claude plugin validate .claude-plugin/marketplace.json --strict

          # Validation targets come from the marketplace itself: a plugin can
          # never be registered and then silently left unvalidated. Marketplace
          # --strict passes over a missing source dir and never opens skills,
          # so each plugin directory is validated on its own.
          jq -r '.plugins[].source' .claude-plugin/marketplace.json \
            | sed 's#^\./##;s#/$##' | sort > /tmp/listed.txt
          while read -r src; do
            if [ ! -d "$src" ]; then
              echo "marketplace.json lists '$src' but that directory does not exist" >&2
              exit 1
            fi
            claude plugin validate "$src" --strict
          done < /tmp/listed.txt

          # ...and the reverse: a plugin directory nobody registered.
          ls -d plugins/*/ | sed 's#/$##' | sort > /tmp/present.txt
          if ! diff -u /tmp/listed.txt /tmp/present.txt; then
            echo "plugins/ and marketplace.json disagree (-marketplace +on disk)" >&2
            exit 1
          fi

      - name: Portability scan — no machine-specific facts anywhere in the repo
        run: |
          # Scans the whole repo, not just plugins/: README, CHANGELOG and docs
          # leak machine paths just as easily. This workflow is excluded because
          # it necessarily contains the patterns it searches for.
          if grep -rEn '/Users/|/home/[a-z]|[A-Za-z]:\\Users|/private/tmp|claude-501|linear\.app/[a-z]|atlassian\.net' \
               --exclude-dir=.git --exclude=validate.yml .; then
            echo "Machine- or workspace-specific facts found in repo content" >&2
            exit 1
          fi

      - name: markdownlint
        run: npx --yes markdownlint-cli2 "**/*.md"
